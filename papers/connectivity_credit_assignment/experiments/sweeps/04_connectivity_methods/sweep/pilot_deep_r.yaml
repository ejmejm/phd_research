# DEEP-R at its best v1 cell, run long, to find where the curve flattens.
#
# Not a sweep -- a single configuration wrapped in the sweep machinery so it can
# use the cluster's comet agent launcher. From the v1 grid: l1=1e-3 appears in
# every top cell and lr=2^-7 won outright. noise_ratio is a tie -- 0, 0.3, 1 and
# 3 span 0.577-0.585 at this cell over 3 seeds -- so 1.0 is used, the paper's
# drifting-task setting, rather than the nominal winner at 3.0.
# lr is 2^-7, the rate that won the 100k grid outright. 2^-8 was tried first,
# on the reasoning that a short run flatters a too-high rate, and its curve was
# read off the pilot; this run is the 2x-higher counterpart. Note 2^-6 diverges
# here for every arm, static-sparse control included, so 2^-7 is the top of the
# usable range rather than a midpoint.
name: 04_deep_r_n16_pilot2m
project: paper-weight-pruning-connectivity-pilot
command: python experiments/train.py --config-path=sweeps/04_connectivity_methods --config-name=base
algorithm: grid

spec:
  metric: asymptotic_accuracy
  objective: maximize
  retryAssignLimit: 4

parameters:
  comet_ml: true
  mlflow: false
  log_individual_seeds: true   # per-seed curves: a steady state has to hold per seed

  train.total_steps: 2000000

  model.type: padded_mlp
  model.init_strategy: sparse
  model.sparse.init_mode: uniform_p
  model.sparse.weight_init: normal
  algorithm.name: deep_r
  algorithm.event_period: 1
  algorithm.evolve_w2: true

  target_hidden_units: 768
  algorithm.l1: 1e-3
  algorithm.noise_ratio: 1.0
  optimizer.learning_rate: "${eval:2**-7}"

  seed:
    value: [0, 1, 2]
