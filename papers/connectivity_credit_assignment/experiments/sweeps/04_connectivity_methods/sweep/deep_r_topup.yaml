# DEEP-R (Bellec et al. 2018) at 16 tasks, non-stationary.
#
#   w <- w - lr*dL/dw - lr*l1*sign(w) + sqrt(2*lr*T)*nu
#
# A connection dies when its weight crosses zero and a dormant one is
# reactivated at random, so the connection count is constant.
#
# GRID ANCHORING. Weak settings (l1=1e-5, T=1e-7) produce almost no structural
# change at this scale, which would make DEEP-R indistinguishable from the
# static-sparse arm. Both mechanisms have to move a typical weight
# (|w| ~ 0.031 at H=256, 0.062 at H=1024) on the 2000-step drift timescale:
#
#   L1:    steps to reach zero = |w| / (lr*l1)   -> ~2000 at l1=1e-3, lr=2^-6
#   noise: displacement after N steps = sqrt(N * 2*lr*T)
#                                      -> ~|w| after 2000 steps at T=1.5e-5
#
# so the grid brackets l1=1e-3 and T=1e-5. Note both scale with the learning
# rate -- the L1 pull linearly, the noise as its square root -- so the corners
# at lr=2^-8 are 4x and 2x weaker than the same (l1, T) at 2^-6.
#
# VERIFY THIS RATHER THAN TRUST IT: every run logs cumulative_pruned and
# cumulative_regrown. Check that the chosen cells turn connections over at a
# rate comparable to the SET arm; if the whole grid is flat, extend upward
# (l1=1e-1, T=1e-4) rather than reading the result as "DEEP-R does nothing".
#
# TOP-UP (v2b). The v2 sweep lost its remaining assignments when agents on a
# misconfigured cluster failed every trial in seconds and burned through the
# grid, marking the sweep `completed` with 40 cells unrun. All of them were at
# the widest setting, which the agents had left for last. This re-runs that
# width only; 8 cells that did finish are re-run as the price of keeping the
# grid expressible, which is cheaper than enumerating the gaps one sweep each.
name: 04_deep_r_n16_v2b_h768
project: paper-weight-pruning-connectivity-sweep
command: python experiments/train.py --config-path=sweeps/04_connectivity_methods --config-name=base
algorithm: grid

spec:
  metric: asymptotic_accuracy
  objective: maximize
  retryAssignLimit: 4

parameters:
  comet_ml: true
  mlflow: false
  log_individual_seeds: false

  # 800k steps. The 2M pilot at lr=2^-7 put SET's gain at under half a percent
  # per 100k by 700-800k (block means 0.5742 -> 0.5800 -> 0.5833), and DEEP-R
  # flat from 200k on, so 800k catches the slower arm just as it levels off.
  train.total_steps: 800000

  model.type: padded_mlp
  model.init_strategy: sparse
  # DEEP-R's own initialization: flat per-layer density, uniformly random
  # positions. Not SET's epsilon formula, which is specific to SET.
  model.sparse.init_mode: uniform_p
  model.sparse.weight_init: normal   # DEEP-R Appendix A: N(0,1)/sqrt(dense n_in)
  algorithm.name: deep_r
  # The published per-step sampler. Affordable because reactivation needs no
  # sort: 61 s per 20k steps at H=768 against 52 s at event_period=25, so the
  # coarse-grained variant buys nothing.
  algorithm.event_period: 1
  algorithm.evolve_w2: true

  # One width fewer than the SET grid; DEEP-R is the costly arm and H=1024 can
  # be added once the cheaper widths show whether width matters here at all.
  target_hidden_units: [768]

  algorithm.l1: [1e-4, 1e-3, 1e-2]
  # Noise-to-drift ratio sqrt(2*eta*T)/(eta*alpha); temperature is derived
  # from it in base.yaml. 1.0 is the paper's drifting-task setting, below 1 is
  # the soft-DEEP-R guidance, 0 is deterministic sign-flip pruning (its TIMIT
  # setting). Gridding absolute T instead would let this ratio drift by 8x
  # across the learning-rate axis.
  algorithm.noise_ratio: [0, 0.3, 1.0, 3.0]

  # Shifted down one notch from the 2^-8..2^-5 window this grid first carried.
  # Measured at H=512, 200k steps: 2^-6 diverges for SET, DEEP-R *and* the
  # static-sparse control (so it is the rate, not the rewiring), while 2^-7 is
  # the best stable cell for SET (0.507) and 2^-8 for DEEP-R (0.579). 2^-6 is
  # kept as the upper edge because the narrower widths may tolerate it.
  optimizer.learning_rate:
    - "${eval:2**-10}"
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"

  # 3 width x 3 l1 x 4 noise_ratio x 4 LR = 144 trials, 3 vmapped seeds each.
  seed:
    value: [0, 1, 2, 3, 4]
