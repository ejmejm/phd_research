# Continual SET with median utility reset and layer-wide random regrowth.
# Final Figure 4 configuration.
# Each layer retains its connection count; individual input counts may vary.
# New weights use LeCun uniform at the receiving unit's post-regrowth fan-in.
# The 30 seeds, hyperparameters, and 2M-step horizon match Figure 4.

name: 04_continual_set_median_global_n16_best_2m
project: paper-weight-pruning-connectivity-best
command: python experiments/train.py --config-path=sweeps/04_connectivity_methods --config-name=base
algorithm: grid

spec:
  metric: asymptotic_accuracy
  objective: maximize
  retryAssignLimit: 4

parameters:
  comet_ml: true
  mlflow: false
  log_individual_seeds: true

  train.total_steps: 2000000

  model.type: padded_mlp
  model.init_strategy: sparse
  model.sparse.init_mode: epsilon
  model.sparse.weight_init: lecun_sparse
  algorithm.name: set
  algorithm.prune_metric: utility
  algorithm.regrow: layer_lecun
  algorithm.utility_reset: median
  algorithm.evolve_frequency: 500
  target_hidden_units: 256
  algorithm.zeta: 0.01
  algorithm.utility_decay: 0.9999
  optimizer.learning_rate: "${eval:2**-8}"

  seed_offset: [101, 116]
  seed:
    value:
      - "${eval:${seed_offset} + 0}"
      - "${eval:${seed_offset} + 1}"
      - "${eval:${seed_offset} + 2}"
      - "${eval:${seed_offset} + 3}"
      - "${eval:${seed_offset} + 4}"
      - "${eval:${seed_offset} + 5}"
      - "${eval:${seed_offset} + 6}"
      - "${eval:${seed_offset} + 7}"
      - "${eval:${seed_offset} + 8}"
      - "${eval:${seed_offset} + 9}"
      - "${eval:${seed_offset} + 10}"
      - "${eval:${seed_offset} + 11}"
      - "${eval:${seed_offset} + 12}"
      - "${eval:${seed_offset} + 13}"
      - "${eval:${seed_offset} + 14}"
