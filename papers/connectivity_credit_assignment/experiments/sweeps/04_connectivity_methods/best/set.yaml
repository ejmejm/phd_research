# SET (Mocanu et al. 2018) at its best cell.
#
# 30 seeds at the best cell from the sweeps, split into two 15-seed halves by
# ``seed_offset``; one trial vmaps its 15 seeds and the halves are concatenated
# in the analysis notebook. 800,000 steps, the same horizon the sweeps used.
#
# 0.6329 at H=256 -- an interior optimum confirmed by v3, which added H=64 and
# H=128 below it (0.42 and 0.59). evolve_frequency is a measured null: 500,
# 1000, 2000 and 4000 span 0.6262-0.6329, inside the +-0.020 seed spread, so
# 1000 is the argmax of a flat axis rather than a tuned value.

name: 04_set_n16_best
project: paper-weight-pruning-connectivity-best
command: python experiments/train.py --config-path=sweeps/04_connectivity_methods --config-name=base
algorithm: grid

spec:
  metric: asymptotic_accuracy
  objective: maximize
  retryAssignLimit: 4

parameters:
  comet_ml: true
  mlflow: false
  # Upload the full (log_periods, seeds) curve arrays as one end-of-run asset,
  # which is what the confidence intervals in the figures are computed from.
  log_individual_seeds: true

  train.total_steps: 800000

  model.type: padded_mlp
  model.init_strategy: sparse
  model.sparse.init_mode: epsilon   # SET's Erdos-Renyi construction
  model.sparse.weight_init: glorot  # SET's Keras default, dense fan-in
  algorithm.name: set
  algorithm.prune_metric: magnitude
  target_hidden_units: 256
  algorithm.evolve_frequency: 1000
  optimizer.learning_rate: "${eval:2**-8}"

  seed_offset: [101, 116]
  seed:
    value:
      - "${eval:${seed_offset} + 0}"
      - "${eval:${seed_offset} + 1}"
      - "${eval:${seed_offset} + 2}"
      - "${eval:${seed_offset} + 3}"
      - "${eval:${seed_offset} + 4}"
      - "${eval:${seed_offset} + 5}"
      - "${eval:${seed_offset} + 6}"
      - "${eval:${seed_offset} + 7}"
      - "${eval:${seed_offset} + 8}"
      - "${eval:${seed_offset} + 9}"
      - "${eval:${seed_offset} + 10}"
      - "${eval:${seed_offset} + 11}"
      - "${eval:${seed_offset} + 12}"
      - "${eval:${seed_offset} + 13}"
      - "${eval:${seed_offset} + 14}"
