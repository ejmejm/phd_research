# Rebuttal appendix: dense at block-sparse's width across permutation rates.
#
# Matches Figure 1 (24 hidden units each, ~76K dense weights). The block-sparse
# side already exists (pre-release 04_block_sparse_permute_period_lr, 24 units,
# 5 seeds), and so does dense-24 at 800 steps (02_dense_scaling_4task_nonstationary_lr,
# 2^-11 to 2^-8, best 2^-9). This adds dense-24 at the other periods.
#
# 2^-12 to 2^-8: dense-48's best fell to 2^-10 at long periods, so one value
# below the usual dense grid in case dense-24 goes lower still.
#
# 5 periods x 5 step-sizes = 25 trials, 5 seeds vmapped in each.
name: 07_dense_permute_period
project: paper-weight-pruning-rebuttal
command: python experiments/train.py --config-path=sweeps/01_matched_and_scaling --config-name=base_nonstationary
algorithm: grid

spec:
  metric: asymptotic_accuracy
  objective: maximize
  retryAssignLimit: 4

parameters:
  comet_ml: true
  mlflow: false
  log_individual_seeds: true

  model.init_strategy: dense
  model.initial_hidden_units: 24
  task.permute_period: [200, 400, 1600, 3200, 6400]

  optimizer.learning_rate:
    - "${eval:2**-12}"
    - "${eval:2**-11}"
    - "${eval:2**-10}"
    - "${eval:2**-9}"
    - "${eval:2**-8}"

  seed:
    value: [0, 1, 2, 3, 4]
