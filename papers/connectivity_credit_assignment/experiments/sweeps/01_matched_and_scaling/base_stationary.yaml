# Figures 1 (left) and 2 (left): stationary 4-task multi-MNIST.
#
# Test accuracy is evaluated on a held-out pool every 10k steps. In the
# stationary problem the network converges, so converged test performance is
# the meaningful measure.
project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

comet_ml: true
mlflow: false
wandb: false

task:
  n_tasks: 4
  permute_period: 0          # stationary
  standardize: true

model:
  type: padded_mlp
  init_strategy: block_sparse   # overridden per sweep
  initial_hidden_units: 24      # overridden per sweep
  max_hidden_units: ${model.initial_hidden_units}
  activation: leaky_relu

algorithm:
  name: static

optimizer:
  name: sgd
  learning_rate: ${eval:2**-10}  # overridden per sweep
  weight_decay: 0

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 10_000

seed: [0]
log_individual_seeds: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
