defaults:
  - full_feature_search
  - _self_

model:
  hidden_dim: ${task.hidden_dim}
  use_bias: true

feature_recycling:
  recycle_rate: 0.0

train:
  standardize_cumulants: true
  log_feature_match_stats: true

optimizer:
  name: idbd # {idbd, adam, rmsprop, sgd}
  learning_rate: 0.00001 # Initial step-size for idbd

seed: 20251107