defaults:
- core_transient_binary
- _self_

wandb: false

task:
  n_outputs: 20

  n_transient_layers: 2
  transient_sparsity: 0.9
  transient_activation_rate: 0.05

model:
  n_layers: 4
  hidden_dim: 256
  activation: ltu
  use_bias: false

train:
  total_steps: 5_000_000
  log_freq: 2000

optimizer:
  name: idbd
  autostep: true
  learning_rate: 8.0
  meta_learning_rate: 0.05

seed: [2512231, 2512232, 2512233, 2512234, 2512235]

