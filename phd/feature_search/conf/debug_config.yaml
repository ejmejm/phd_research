defaults:
- full_feature_search
- _self_

wandb: false
comet_ml: false

device: cuda

model:
  hidden_dim: 2000
  n_frozen_layers: 0
  use_normalize_and_project: false
  weight_init_method: lecun_uniform

task:
  distractor_chance: 0.0
  noise_std: 0.0
  distractor_mean_range: [ 0.0, 0.0 ]
  flip_rate: 0.0

feature_recycling:
  recycle_rate: 0.0
  use_signed_utility: False
  initial_step_size_method: constant
  prune_frequency: 4
  incoming_weight_init: binary
  feature_protection_steps: 0

train:
  total_steps: 2_000_000
  log_freq: 4_000
  standardize_cumulants: true
  log_feature_match_stats: true

optimizer:
  name: idbd
  learning_rate: 0.0001 # ${eval:0.0003 / ${model.hidden_dim} ** 0.75}
  version: squared_grads
  weight_decay: 0.0
  autostep: true
  step_size_decay: 0.0

representation_optimizer:
  name: sgd # {null, sgd, sgd_momentum, rmsprop, adam, idbd}
  weight_decay: 0
  learning_rate: 1.0


seed: [1, 2, 3] # 20250827
