name: autostep_feature_search
project: stationary_optimizer_comparison
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/core_transient_task/stationary_optimizer_comparison/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  model.n_frozen_layers: ${eval:${model.use_perfect_features} * ${task.n_core_layers}}

  feature_recycling.utility_reset_mode: median
  feature_recycling.feature_protection_steps: 0
  feature_recycling.recycle_rate: [0.0, 0.0001, 0.001, 0.005, 0.01]
  feature_recycling.utility_decay: [0.99, 0.999, 0.9999]

  optimizer.learning_rate:
    - "${eval:2**-20}"
    - "${eval:2**-16}"
    - "${eval:2**-12}"
    - "${eval:2**-8}"
    - "${eval:2**-4}"

  optimizer.meta_learning_rate:
    - "${eval:2**-10}"
    - "${eval:2**-8}"
    - "${eval:2**-6}"
  
  seed: [201, 202, 203, 204, 205]