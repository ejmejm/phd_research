name: autostep
project: core_transient_problem_variations_best
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/core_transient_task/problem_variations/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  model.n_frozen_layers: ${eval:${model.use_perfect_features} * ${task.n_core_layers}}

  train.total_steps: 20_000_000
  train.log_update_stats: true
  train.log_optimizer_stats: true

  task.input_change_freq: 4_000
  task.max_input_center_change: 0.1

  optimizer.name: idbd
  optimizer.autostep: true
  optimizer.learning_rate: 8.0
  optimizer.meta_learning_rate: 0.00390625
  
  model.use_perfect_features: [true, false]

  seed: [201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224, 225, 226, 227, 228, 229, 230]