name: sgd
project: core_transient_problem_variations
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/core_transient_task/problem_variations/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  model.n_frozen_layers: ${eval:${model.use_perfect_features} * ${task.n_core_layers}}

  task.input_change_freq: 4_000
  task.max_input_center_change: 0.1

  optimizer.name: sgd
  optimizer.learning_rate:
    - "${eval:2**-17}"
    - "${eval:2**-15}"
    - "${eval:2**-13}"
    - "${eval:2**-11}"
    - "${eval:2**-9}"
    - "${eval:2**-7}"
    - "${eval:2**-5}"
    - "${eval:2**-3}"
    - "${eval:2**-1}"
    - "${eval:2**1}"
  
  model.use_perfect_features: [true, false]

  seed: [101, 102, 103, 104, 105]