name: adam_v2
project: stationary_binary_regression
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/problem_variations/stationary_binary_regression/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  model.n_layers: 3
  model.hidden_dim: 256
  model.activation: ltu

  task.hidden_dim: 20
  task.n_outputs: 10

  optimizer.name: adam

  optimizer.learning_rate:
    - "${eval:2**-14}"
    - "${eval:2**-12}"
    - "${eval:2**-10}"
    - "${eval:2**-8}"
    - "${eval:2**-6}"
    - "${eval:2**-4}"
    - "${eval:2**-2}"
    - "${eval:2**0}"
  
  train.batch_size: [1, 32]

  seed: [2512191, 2512192, 2512193, 2512194, 2512195]