# @package _global_

defaults:
  - /binary_regression
  - _self_

comet_ml: true
device: cuda
jax_jit_cache_dir: ${oc.env:HOME}/scratch/jax_cache

model:
  n_layers: 3
  hidden_dim: 256
  activation: ltu
  use_bias: false
  n_frozen_layers: 0
  weight_init_method: lecun_uniform

task:
  n_features: 10
  hidden_dim: 20
  n_outputs: 5
  n_layers: 2
  flip_rate: 0.0
  input_change_freq: 20_000
  input_bounds: [-1.0, 1.0]
  input_subspace_range: 0.5

feature_recycling:
  recycle_rate: 0.0

train:
  total_steps: 5_000_000
  standardize_cumulants: false

  # Logging parameters
  log_freq: 10000
  log_utility_stats: false
  log_pruning_stats: false
  log_model_stats: false
  log_feature_matched_optimizer_stats: false
  log_feature_match_stats: false

optimizer:
  name: idbd
  version: prediction_grads
  autostep: true
  learning_rate: ${eval:0.03 / ${model.hidden_dim} ** 0.75}
  meta_learning_rate: 0.005

representation_optimizer:
  name: null # {null, sgd, sgd_momentum, rmsprop, adam, idbd}
  weight_decay: 0
  learning_rate: 0.1