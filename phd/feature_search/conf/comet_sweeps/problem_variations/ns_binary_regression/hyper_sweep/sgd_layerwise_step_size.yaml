name: sgd_layerwise_step_size
project: ns_binary_regression
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/problem_variations/ns_binary_regression/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  train.log_freq: 4000

  optimizer.name: sgd
  optimizer.learning_rate:
    - "${eval:2**-24}"
    - "${eval:2**-22}"
    - "${eval:2**-18}"
    - "${eval:2**-16}"
    - "${eval:2**-14}"
    - "${eval:2**-12}"

  representation_optimizer.name: sgd
  representation_optimizer.learning_rate:
    - "${eval:2**-4}"
    - "${eval:2**-2}"
    - "${eval:2**0}"
    - "${eval:2**2}"
    - "${eval:2**4}"

  seed: [2512201, 2512202, 2512203, 2512204, 2512205]