name: sgd_layerwise_step_size
project: generalization_paper_v4_grad_descent_hyper_sweep
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/paper_v4/stationary_grad_descent/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  optimizer.name: sgd
  optimizer.learning_rate:
    - "${eval:2**-22}"
    - "${eval:2**-20}"
    - "${eval:2**-18}"
    - "${eval:2**-16}"
    - "${eval:2**-14}"
    - "${eval:2**-12}"
    - "${eval:2**-10}"

  representation_optimizer.name: sgd
  representation_optimizer.learning_rate:
    - "${eval:2**-2}"
    - "${eval:2**0}"
    - "${eval:2**2}"
    - "${eval:2**4}"
    - "${eval:2**6}"
    - "${eval:2**8}"
  
  seed: [1001, 1002, 1003, 1004, 1005]
