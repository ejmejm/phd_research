name: sgd_layerwise_step_size
project: generalization_paper_v4_ns_grad_descent_fs_hyper_sweep
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/paper_v4/ns_grad_descent_fs/base_config.yaml
algorithm: random
trials: 5

spec:
  metric: scaled_loss
  objective: minimize
  retryAssignLimit: 4
  maxCombo: 1000

parameters:
  train.log_scaled_loss: true

  optimizer.name: sgd
  optimizer.learning_rate:
    - "${eval:2**-18}"
    - "${eval:2**-17}"
    - "${eval:2**-16}"
    - "${eval:2**-15}"
    - "${eval:2**-14}"
    - "${eval:2**-13}"
    - "${eval:2**-12}"
    - "${eval:2**-11}"
    - "${eval:2**-10}"
    - "${eval:2**-9}"
    - "${eval:2**-8}"

  representation_optimizer.name: sgd
  representation_optimizer.learning_rate:
    - "${eval:2**-4}"
    - "${eval:2**-2}"
    - "${eval:2**0}"
    - "${eval:2**2}"
    - "${eval:2**4}"
    - "${eval:2**6}"
    - "${eval:2**8}"
  
  feature_recycling.recycle_rate:
    - "${eval:2**-16}"
    - "${eval:2**-14}"
    - "${eval:2**-12}"
    - "${eval:2**-10}"
    - "${eval:2**-8}"
    - "${eval:2**-6}"
    - "${eval:2**-4}"
    - "${eval:2**-2}"

  feature_recycling.utility_decay: [0.99, 0.999, 0.9999, 0.99999, 0.999999]
