name: sgd_and_search_input_layer
project: generalization_paper_draft_v2_sgd_baselines_v2
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/paper_draft_v2_part_1/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  model.n_frozen_layers: 0

  model.hidden_dim: 5120
  model.weight_init_method: lecun_uniform

  representation_optimizer.name: sgd
  representation_optimizer.learning_rate:
    - "${eval:2**-2}"
    - "${eval:2**-1}"
    - "${eval:2**0}"
    - "${eval:2**1}"
    - "${eval:2**2}"
    - "${eval:2**3}"
    - "${eval:2**4}"
    - "${eval:2**5}"

  optimizer.name: idbd
  optimizer.learning_rate: "${eval:0.03 / ${model.hidden_dim} ** 0.75}"
  optimizer.meta_learning_rate: [0.01, 0.005, 0.001]
  
  feature_recycling.incoming_weight_init: lecun_uniform
  feature_recycling.recycle_rate: [0.0, 0.00001, 0.0001, 0.001, 0.01, 0.05, 0.1, 0.2]

  task.flip_rate: 0.0
  seed: [801, 802, 803, 804, 805]