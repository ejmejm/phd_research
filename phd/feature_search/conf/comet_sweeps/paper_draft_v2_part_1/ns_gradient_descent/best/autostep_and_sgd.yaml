name: autostep_and_sgd
project: ns_gradient_descent_best
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/paper_draft_v2_part_1/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  train.total_steps: 30_000_000
  model.n_frozen_layers: 0
  model.hidden_dim: 5120
  model.weight_init_method: lecun_uniform
  task.flip_rate: "${eval:2**-12}"
  feature_recycling.recycle_rate: 0.0
  feature_recycling.incoming_weight_init: lecun_uniform

  optimizer.name: idbd
  optimizer.autostep: true
  optimizer.version: squared_grads

  optimizer.learning_rate: "${eval:2**-12}"
  optimizer.meta_learning_rate: "${eval:2**-7}"

  representation_optimizer.name: sgd
  representation_optimizer.learning_rate: "${eval:2**2}"

  seed: [901, 902, 903, 904, 905, 906, 907, 908, 909, 910, 911, 912, 913, 914, 915, 916, 917, 918, 919, 920, 921, 922, 923, 924, 925, 926, 927, 928, 929, 930]