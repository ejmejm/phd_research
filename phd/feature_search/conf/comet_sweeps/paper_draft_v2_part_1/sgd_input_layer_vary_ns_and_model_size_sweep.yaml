name: sgd_input_layer_vary_ns_and_model_size
project: generalization_paper_draft_v2_part_1_hyper_search
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/paper_draft_v2_part_1/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  task.n_stationary_layers: 0

  representation_optimizer.name: sgd
  representation_optimizer.learning_rate: ["${eval:2**-1}", "${eval:2**-3}", "${eval:2**-5}", "${eval:2**-7}"]

  optimizer.name: idbd
  optimizer.learning_rate: 
    - "${eval:0.03 / ${model.hidden_dim} ** 0.75}"
    - "${eval:0.003 / ${model.hidden_dim} ** 0.75}"
    - "${eval:0.0003 / ${model.hidden_dim} ** 0.75}"
  optimizer.meta_learning_rate: [0.01, 0.005, 0.001]

  model.hidden_dim: [320, 1280, 5120, 20480]
  task.flip_rate: ["${eval:0.0}", "${eval:2**-18}", "${eval:2**-14}"]
  seed: [701, 702, 703, 704, 705]