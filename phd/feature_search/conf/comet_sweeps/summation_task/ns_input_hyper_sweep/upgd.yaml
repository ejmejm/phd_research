name: upgd
project: ns_input_summation
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/summation_task/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  task.change_multiplier_freq: 200

  optimizer.name: upgd
  optimizer.learning_rate:
    - "${eval:2**-15}"
    - "${eval:2**-12}"
    - "${eval:2**-9}"
    - "${eval:2**-6}"
    - "${eval:2**-3}"

  optimizer.beta_utility:
    - 0.0
    - 0.9
    - 0.99
    - 0.999

  optimizer.sigma:
    - 0.0001
    - 0.001
    - 0.01
    - 0.1
    - 1.0

  optimizer.weight_decay:
    - 0.1
    - 0.01
    - 0.001

  seed: [301, 302, 303, 304, 305]