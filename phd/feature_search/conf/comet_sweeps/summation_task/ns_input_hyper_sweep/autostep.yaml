name: autostep
project: ns_input_summation
command: python scripts/jax_full_feature_search.py --config-name=comet_sweeps/summation_task/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  task.change_multiplier_freq: 200

  optimizer.name: idbd
  optimizer.autostep: true
  optimizer.learning_rate:
    - "${eval:2**-13}"
    - "${eval:2**-11}"
    - "${eval:2**-9}"
    - "${eval:2**-7}"
    - "${eval:2**-5}"
    - "${eval:2**-3}"
    - "${eval:2**-1}"
  optimizer.meta_learning_rate:
    - "${eval:2**-14}"
    - "${eval:2**-12}"
    - "${eval:2**-10}"
    - "${eval:2**-8}"
    - "${eval:2**-6}"
    - "${eval:2**-4}"

  seed: [301, 302, 303, 304, 305]