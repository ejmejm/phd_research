name: cbp_utility
project: eliminate_step_size
command: python scripts/jax_multiseed_feature_search.py --config-name=comet_sweeps/eliminate_step_size/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:

  optimizer.name: idbd
  optimizer.autostep: true
  optimizer.learning_rate:
    - "${eval:2**-18}"
    - "${eval:2**-17}"
    - "${eval:2**-16}"
    - "${eval:2**-15}"
    - "${eval:2**-14}"
    - "${eval:2**-13}"
    - "${eval:2**-12}"
  optimizer.meta_learning_rate:
    - "${eval:2**-8}"
    - "${eval:2**-7}"
    - "${eval:2**-6}"
    - "${eval:2**-5}"
    - "${eval:2**-4}"
    - "${eval:2**-3}"

  feature_recycling.use_signed_utility: [true, false]