name: shadow_features
project: eliminate_step_size
command: python scripts/jax_multiseed_feature_search.py --config-name=comet_sweeps/eliminate_step_size/base_config.yaml
algorithm: grid

spec:
  metric: cumulative_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  feature_recycling.use_signed_utility: true

  optimizer.name: idbd
  optimizer.autostep: true

  optimizer.learning_rate:
    - "${eval:2**-19}"
    - "${eval:2**-17}"
    - "${eval:2**-15}"
    - "${eval:2**-13}"
    - "${eval:2**-11}"
  optimizer.meta_learning_rate:
    - "${eval:2**-7}"
    - "${eval:2**-6}"
    - "${eval:2**-5}"
    - "${eval:2**-4}"
    - "${eval:2**-3}"

  feature_recycling.recycle_rate:
    - "${eval:2**-5}"
    - "${eval:2**-6}"
    - "${eval:2**-7}"
    - "${eval:2**-8}"
    - "${eval:2**-9}"

  optimizer.shadow_weight_threshold_factor: [0.0, 0.01, 0.1, 0.5, 1.0, 1.5, 2.0]
