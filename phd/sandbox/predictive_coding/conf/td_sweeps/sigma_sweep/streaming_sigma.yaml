experiment: td-value-prediction
sweep_name: td_streaming_sigma
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python -m phd.sandbox.predictive_coding.td_train
algorithm: grid

spec:
  metric: asymptotic_msve
  direction: minimize

plot_params:
  metrics: [asymptotic_msve, asymptotic_td_error]

parameters:
  mlflow: true
  log_individual_seeds: true

  algorithm: ipc
  ipc.variant: streaming
  ipc.T: 1
  ipc.gamma: 0.5

  model.num_layers: 3
  model.hidden_dim: 128
  model.activation: tanh

  train.total_steps: 500000
  train.log_freq: 1000
  train.eval_freq: 5000

  env.sigma:
    - 0.005
    - 0.01
    - 0.03
    - 0.1

  # Small LR grid to handle sigma-dependent optimal LR
  ipc.alpha:
    - "${eval:2**-12}"
    - "${eval:2**-10}"
    - "${eval:2**-8}"

  seed:
    type: atomic
    value: [1, 2, 3, 4, 5]
