experiment: streaming-ipc-sweeps
sweep_name: streaming_depth_sweep
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python train.py
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: maximize

plot_params:
  metrics: [asymptotic_accuracy, asymptotic_energy]
  sensitivity:
    hue: ipc.alpha

parameters:
  mlflow: true
  log_individual_seeds: true

  algorithm: ipc
  ipc.variant: streaming
  ipc.T: 1
  ipc.gamma: 0.5
  data.delta_degrees: 5

  model.hidden_dim: 256
  model.activation: relu

  train.total_steps: 100000
  train.log_freq: 1000

  model.num_layers:
    - 3
    - 4
    - 5

  ipc.alpha:
    - "${eval:2**-14}"
    - "${eval:2**-12}"
    - "${eval:2**-10}"

  seed:
    type: atomic
    value: [1, 2, 3]
