experiment: streaming-ipc-sweeps
sweep_name: ema_ipc_lr
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python train.py
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: maximize

plot_params:
  metrics: [asymptotic_accuracy, asymptotic_energy]

parameters:
  mlflow: true
  log_individual_seeds: true

  algorithm: ipc
  ipc.variant: ema
  ipc.ema_beta: 0.9
  ipc.T: 1
  ipc.gamma: 0.5

  model.num_layers: 3
  model.hidden_dim: 256
  model.activation: relu
  data.delta_degrees: 5

  train.total_steps: 100000
  train.log_freq: 1000

  ipc.alpha:
    - "${eval:2**-16}"
    - "${eval:2**-14}"
    - "${eval:2**-12}"
    - "${eval:2**-10}"
    - "${eval:2**-8}"

  seed:
    type: atomic
    value: [1, 2, 3]
