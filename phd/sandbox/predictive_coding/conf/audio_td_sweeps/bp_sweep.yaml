experiment: audio-td-value-prediction
sweep_name: audio_bp_sweep
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python audio_td_train.py
algorithm: grid

spec:
  metric: asymptotic_msve
  direction: minimize

plot_params:
  metrics: [asymptotic_msve, asymptotic_td_error, average_msve]

parameters:
  mlflow: true
  log_individual_seeds: false

  algorithm: bp

  model.num_layers: 3
  model.hidden_dim: 128
  model.activation: tanh

  env.gamma_td: 0.98
  optimizer.td_lambda: 0.9

  train.total_steps: 500_000
  train.log_freq: 1000

  optimizer.learning_rate:
    - "${eval:2**-18}"
    - "${eval:2**-14}"
    - "${eval:2**-12}"
    - "${eval:2**-10}"
    - "${eval:2**-8}"

  seed:
    type: atomic
    value: [1, 2, 3, 4, 5]
