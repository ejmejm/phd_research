experiment: feature_sifting_sweeps
sweep_name: lms_ns_v1
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python run_experiment.py --config-path=conf/sweeps/algorithm_comparison --config-name=base_lms
algorithm: grid

spec:
  metric: final_loss
  direction: minimize

parameters:
  mlflow: true
  method.name: lms
  train.total_steps: 300_000
  task.flip_period: 100

  # Seeds are vmapped inside the script -> one run for the whole set, not one per seed.
  seed:
    type: atomic
    value: [1, 2, 3, 4, 5]

  # Swept hyperparameter (declared in base_lms.yaml, so no `+` prefix is needed).
  method.hparams.learning_rate:   # 2^-15 .. 2^-9
    - "${eval:2**-15}"
    - "${eval:2**-14}"
    - "${eval:2**-13}"
    - "${eval:2**-12}"
    - "${eval:2**-11}"
    - "${eval:2**-10}"
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"
    - "${eval:2**-6}"
    - "${eval:2**-5}"
    - "${eval:2**-4}"
    - "${eval:2**-3}"
    - "${eval:2**-2}"
    - "${eval:2**-1}"
