# Self-contained base config for the LMS algorithm-comparison sweeps. Mirrors
# conf/feature_sifting.yaml with the method fixed to lms and its hyperparameter
# declared (so sweeps can override it without the `+` prefix). Referenced via:
#   python run_experiment.py --config-path=conf/sweeps/algorithm_comparison --config-name=base_lms
project: feature-sifting
device: gpu
jax_jit_cache_dir: /tmp/jax_cache

# Experiment tracking
wandb: false
mlflow: false
comet_ml: false

# Task (feature sifting problem) — passed straight to FeatureSiftingTask.
# flip_period=-1 is stationary; the nonstationary scenario overrides it.
task:
  n_target_features: 10
  n_learner_features: 20
  target_noise_std: 0.0
  flip_period: -1

method:
  name: lms
  hparams:
    learning_rate: ${eval:2**-12}   # placeholder (lms.py default); set by the sweep

# Training
train:
  total_steps: 100_000
  log_freq: 1000

# Seed: single int, a list of ints (vmapped in parallel), or null (random)
seed: null
