project: feature-sifting
device: gpu
jax_jit_cache_dir: /tmp/jax_cache

# Experiment tracking
wandb: false
mlflow: false
comet_ml: false

# Model
model:
  hidden_dim: 64

# Optimizer
optimizer:
  name: sgd
  learning_rate: 0.01

# Training
train:
  batch_size: 128
  total_steps: 10_000
  log_freq: 1000      # steps between log points (Python loop stride)

# Seed: single int (null = random)
seed: null
