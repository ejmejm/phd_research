# Base config for the LMS sweep. Inherits the feature-sifting setup and declares
# the swept hyperparameter under method.hparams, so the sweep can override it
# without the `+` prefix. Used via: run_experiment.py --config-name=lms_sweep
defaults:
  - feature_sifting
  - _self_

method:
  name: lms
  hparams:
    learning_rate: ${eval:2**-12}   # placeholder (lms.py default); set by the sweep
