# mlflow-sweeper config: HONEST (learned gates) on 8-task parallel-MNIST.
#
# Sweep both alpha (base step size) and theta (meta step size for gates).
# Net: 6272 -> 32 (leaky-ReLU) -> 80 outputs, sigmoid + per-output BCE.

experiment: path-gates-multimnist
sweep_name: pg_mm_8task_honest_v1
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python train_multimnist.py
algorithm: grid

spec:
  metric: asymptotic_online_acc
  direction: maximize

plot_params:
  metrics: [asymptotic_online_acc, final_online_acc]
  sensitivity:
    hue: theta

parameters:
  variant: honest
  alpha:
    - "${eval:2**-13}"   # ~1.2e-4
    - "${eval:2**-11}"   # ~4.9e-4
    - "${eval:2**-9}"    # ~2.0e-3
    - "${eval:2**-7}"    # ~7.8e-3
  theta:
    - "${eval:2**-8}"    # ~3.9e-3
    - "${eval:2**-4}"    # ~6.2e-2
    - "${eval:2**0}"     # 1.0
    - "${eval:2**4}"     # 16
    - "${eval:2**8}"     # 256

  hidden_dim: 32
  n_tasks: 8
  permute_period: 200
  activation: leaky_relu
  batch_size: 1
  num_steps: 20000
  log_interval: 200

  seed: [0, 1, 2]
