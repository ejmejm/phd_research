name: adam_sweep_v2_rescaled
project: atari-prediction
command: python train.py --config-name=all_games_config
algorithm: grid

spec:
  metric: asymptotic_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  comet_ml: true

  optimizer.name: adam

  optimizer.learning_rate:
    - "${eval:2**-21}"
    - "${eval:2**-19}"
    - "${eval:2**-17}"
    - "${eval:2**-15}"
    - "${eval:2**-13}"
    - "${eval:2**-11}"
    - "${eval:2**-9}"

  train.reinit_at_game_boundary: [false, true]
  train.rescale_returns: true

  seed:
    value: [1, 2, 3, 4, 5]
