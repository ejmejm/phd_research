name: upgd_sweep_v1
project: atari-prediction
command: python train.py --config-name=all_games_config
algorithm: grid

spec:
  metric: asymptotic_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  comet_ml: true

  optimizer.name: upgd

  optimizer.learning_rate:
    - "${eval:2**-15}"
    - "${eval:2**-12}"
    - "${eval:2**-9}"
    - "${eval:2**-6}"
    - "${eval:2**-3}"

  optimizer.beta_utility:
    - 0.0
    - 0.9
    - 0.99
    - 0.999

  optimizer.sigma:
    - 0.0001
    - 0.001
    - 0.01
    - 0.1
    - 1.0

  optimizer.weight_decay:
    - 0.1
    - 0.01
    - 0.001

  seed:
    value: [1, 2, 3, 4, 5]
