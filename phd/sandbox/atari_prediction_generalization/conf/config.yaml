project: atari-prediction
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

# Experiment tracking
wandb: false
mlflow: false
comet_ml: false

# Dataset
dataset:
  data_dir: ${oc.env:HOME}/local_projects/continual_atari_benchmark/dataset/data
  steps_per_game: 100_000
  data_seed: 0
  game_order:
    - ALE/Pong-v5
    - ALE/Breakout-v5

# Model (placeholder MLP — will be replaced by ResNet)
model:
  n_layers: 2
  hidden_dim: 32
  activation: relu
  weight_init_method: lecun_uniform
  n_frozen_layers: 0

# Optimizer
optimizer:
  name: adam
  learning_rate: 1e-3
  weight_decay: 0

# Training
train:
  total_steps: 200_000
  log_freq: 1000

# Seed: single int or list of ints for multi-seed
seed: null
log_individual_seeds: true
