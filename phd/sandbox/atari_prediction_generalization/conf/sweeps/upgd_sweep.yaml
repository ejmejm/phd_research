experiment: atari-prediction
sweep_name: upgd_sweep_v1
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python train.py
algorithm: grid

spec:
  metric: asymptotic_loss
  direction: minimize

plots: [best_hyperparameters, sensitivity]
plot_params:
  metrics: [asymptotic_loss, average_loss]

parameters:
  mlflow: true

  model.type: resnet
  model.width_scale: 1.0
  model.n_conv_sequences: 3

  optimizer.name: upgd

  optimizer.learning_rate:
    - "${eval:2**-15}"
    - "${eval:2**-12}"
    - "${eval:2**-9}"
    - "${eval:2**-6}"
    - "${eval:2**-3}"

  optimizer.beta_utility:
    - 0.0
    - 0.9
    - 0.99
    - 0.999

  optimizer.sigma:
    - 0.0001
    - 0.001
    - 0.01
    - 0.1
    - 1.0

  optimizer.weight_decay:
    - 0.1
    - 0.01
    - 0.001

  seed:
    type: atomic
    value: [1, 2, 3, 4, 5]
