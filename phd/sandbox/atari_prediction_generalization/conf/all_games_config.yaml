project: atari-prediction
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

# Experiment tracking
wandb: false
mlflow: false
comet_ml: false

# Dataset
dataset:
  data_dir: data/
  steps_per_game: 100_000
  data_seed: 0
  game_order:
    - ALE/Alien-v5
    - ALE/Amidar-v5
    - ALE/Assault-v5
    - ALE/Asterix-v5
    - ALE/BankHeist-v5
    - ALE/BattleZone-v5
    - ALE/Boxing-v5
    - ALE/Breakout-v5
    - ALE/ChopperCommand-v5
    - ALE/CrazyClimber-v5
    - ALE/DemonAttack-v5
    - ALE/Freeway-v5
    - ALE/Frostbite-v5
    - ALE/Gopher-v5
    - ALE/Hero-v5
    - ALE/Jamesbond-v5
    - ALE/Kangaroo-v5
    - ALE/Krull-v5
    - ALE/KungFuMaster-v5
    - ALE/MsPacman-v5
    - ALE/Pong-v5
    - ALE/PrivateEye-v5
    - ALE/Qbert-v5
    - ALE/RoadRunner-v5
    - ALE/Seaquest-v5
    - ALE/UpNDown-v5

# Model
model:
  type: resnet           # 'mlp' or 'resnet'

  # ResNet settings
  width_scale: 1.0       # Channel width multiplier (e.g. 0.25, 0.5, 1, 2, 4)
  n_conv_sequences: 3    # Number of ConvSequence blocks

  # MLP settings
  n_layers: 2
  hidden_dim: 32
  activation: relu
  weight_init_method: lecun_uniform
  n_frozen_layers: 0

# Optimizer
optimizer:
  name: adam
  learning_rate: 1e-3
  weight_decay: 0
  # UPGD-specific (used when name: upgd)
  beta_utility: 0.999
  sigma: 0.001

# Preprocessing
preprocessing:
  grayscale: true
  resize: [84, 84]
  frame_stack: 4

# Training
train:
  total_steps: 2_600_000
  log_freq: 4000
  batch_size: 1
  reinit_at_game_boundary: false

# Seed: single int or list of ints for multi-seed
seed: [1, 2, 3, 4, 5]
log_individual_seeds: true
