project: structure-search
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

# Experiment tracking
wandb: false
mlflow: false
comet_ml: false

# Dataset
dataset:
  name: cifar10
  n_tasks: 1           # number of parallel sub-tasks (only for parallel_mnist)
  permute_period: 0    # steps between label permutations (0 = stationary)

# Model
model:
  type: mlp  # 'mlp', 'dynamic', or 'block_sparse'
  target_params: null  # if set, compute hidden_dim to match this parameter budget
  n_layers: 2
  hidden_dim: 128
  activation: relu
  weight_init_method: lecun_uniform
  use_bias: false
  n_frozen_layers: 0

  # DynamicNetwork-specific (only used when type=dynamic)
  max_units_per_layer: null       # defaults to hidden_dim
  max_connections_per_unit: null   # defaults to input_dim
  max_fan_out: null                # defaults to max_units_per_layer
  connect_all_to_output: false    # if true, all hidden units connect to output
  freeze_hidden_weights: false    # if true, only output_weights are trainable
  init_strategy: linear           # 'linear' (input→output) or 'empty' (no connections)

# Optimizer
optimizer:
  name: adam
  learning_rate: 1e-3
  weight_decay: 0

  # IDBD specific parameters
  autostep: true
  meta_learning_rate: 0.002

# Structure tracker (ConnectivityManager for dynamic networks)
structure_tracker:
  enabled: false
  prune_rate: 1e-4           # fraction of connection_budget to accumulate per step
  connection_budget: 1000.0  # total connection budget for pruning/generation
  decay_rate: 0.99           # EMA decay for utility tracking
  maturity_threshold: 100    # min steps before a unit can be pruned (-1 to disable)
  prune_frequency: 100       # restructure every N steps
  utility_fn: contribution   # 'contribution', 'upgd', or 'si'
  generate_strategy: random  # 'random' or 'full_input'
  output_connect_strategy: all  # 'all' or 'random_sparse'
  output_weight_init: zero      # 'zero' or 'lecun_uniform'
  max_new_units_per_step: 512  # max units generated per restructure step

# Training
train:
  batch_size: 1
  total_steps: 100_000
  log_freq: 1000
  loss: mse  # 'mse' or 'cross_entropy'
  eval_freq: 0  # test evaluation every N steps (0 = disabled)

# Seed: single int or list of ints for multi-seed
seed: null
log_individual_seeds: false
