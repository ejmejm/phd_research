device: cuda
jax_jit_cache_dir: /tmp/jax_cache
wandb: false
mlflow: true
comet_ml: false
log_individual_seeds: false

dataset:
  name: parallel_mnist
  n_tasks: 5
  permute_period: 0
  permute_stop: 0     # stop permuting after this step (0 = never stop)

model:
  type: dynamic
  n_layers: 2
  hidden_dim: 520              # 520 * 96 = 49,920 connections at init
  max_units_per_layer: 1040   # 2x hidden_dim; both divisible by n_tasks=5
  max_connections_per_unit: 64
  max_fan_out: 64
  connect_all_to_output: false
  activation: relu
  init_strategy: linear

optimizer:
  name: adam
  learning_rate: ${eval:2**-11}
  weight_decay: 0

train:
  batch_size: 1
  loss: cross_entropy
  total_steps: 200_000
  log_freq: 2000
  eval_freq: 10000

structure_tracker:
  enabled: true
  mode: unit
  connection_budget: 50_000
  decay_rate: 0.999
  maturity_threshold: 1
  prune_frequency: 200
  prune_rate: 0.0001
  max_new_units_per_step: 256

init_mode: random   # 'random' (default) or 'column' (within-column connections only)
seed: 1
project: column-guided-parallel-mnist