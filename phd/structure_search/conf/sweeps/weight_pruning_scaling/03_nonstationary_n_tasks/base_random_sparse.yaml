project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

mlflow: true
wandb: false
comet_ml: false

task:
  n_tasks: 2
  permute_period: ${eval:5000//${task.n_tasks}}
  standardize: true

# random_sparse: 96 units per task (winner of sparsity_search at n=32).
# Per-task budget = 96 * (avg_in + avg_out) = 96 * (29.625 + 20) = 4764 weights.
# avg_in = 4764/96 - 20 = 29.625 -> init_random_range_in upper = 2*avg_in - 1 = 58.
model:
  initial_hidden_units: ${eval:96*${task.n_tasks}}
  max_hidden_units: ${eval:96*${task.n_tasks}}
  activation: leaky_relu

  init_strategy: random_sparse
  init_random_range_in: [1, 58]
  init_random_range_out: [20, 20]

  # Dynamic-network-only fields. max_connections_per_unit is tightened to
  # match range_in upper so the dynamic-network forward pass doesn't pay
  # for unused slots.
  max_connections_per_unit: 58
  max_fan_out: 20

optimizer:
  name: sgd
  learning_rate: 1e-3
  weight_decay: 0

structure_search:
  enabled: false
  prune_frequency: 500
  prune_count: 128
  decay_rate: 0.998
  connection_budget: 15000
  gen_range_in: [128, 128]
  gen_range_out: [20, 20]
  max_units_per_event: 8

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 0

seed: [0, 1, 2, 3, 4]
log_individual_seeds: false
