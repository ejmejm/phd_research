experiment: paper-weight-pruning-scaling-sweep
sweep_name: 03_random_sparse_n_tasks_sparsity_high_lr
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning_dynamic.py --config-path=../conf/sweeps/weight_pruning_scaling/03_nonstationary_n_tasks --config-name=base_random_sparse
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  sensitivity:
    params: [model.initial_hidden_units]
    hue: [optimizer.learning_rate]

parameters:
  task.n_tasks: 32

  # Extends the prior sparsity grid {384, 768, 1536, 3072} (winner was 3072
  # at LR 2**-6, acc 0.420) to one higher level. 6144 units = 192 per task.
  # Outputs per unit fixed at 20; avg_in = 152000/6144 - 20 ~= 4.74, so
  # range_in = [1, 8]. Going past 6144 isn't feasible at the 152k budget
  # because output weights alone (n * 20) would exceed the budget.
  model.initial_hidden_units: 6144
  model.max_hidden_units: ${model.initial_hidden_units}
  # Override base file's 800 -> tight cap for speed (dynamic-network slows
  # markedly when max_connections_per_unit >> actual fan-in).
  model.max_connections_per_unit: 8
  model.init_random_range_in:
    type: atomic
    value: [1, "${eval:'int(2 * (152000 / ${model.initial_hidden_units} - 20) - 1)'}"]
  model.init_random_range_out:
    type: atomic
    value: [20, 20]

  # Centred on the upper edge of the prior sweep (3072 best at 2**-6); per
  # user request, try shifting up to find whether even larger LRs help at
  # this sparsity level.
  optimizer.learning_rate:
    - "${eval:2**-6}"
    - "${eval:2**-5}"
    - "${eval:2**-4}"

  seed:
    type: atomic
    value: [0, 1, 2, 3, 4]
