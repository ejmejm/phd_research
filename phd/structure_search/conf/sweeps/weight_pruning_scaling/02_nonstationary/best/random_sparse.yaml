experiment: paper-weight-pruning-scaling-best
sweep_name: 02_random_sparse_4task_nonstationary_best
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning.py --config-path=../conf/sweeps/weight_pruning_scaling --config-name=base
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  split_by: [model.initial_hidden_units]

parameters:
  task.permute_period: 800
  train.eval_freq: 0
  log_individual_seeds: true

  model.init_strategy: random_sparse
  # Sweep over sparsity by varying unit count while holding total weights
  # ~constant at the 2x base budget (19056). Outputs per unit fixed at 20;
  # avg inputs per unit = 19056/n - 20, init_random_range_in = [1, 2*avg - 1].
  model.initial_hidden_units: [48, 96, 192, 384]
  model.max_hidden_units: ${model.initial_hidden_units}
  model.init_random_range_in:
    type: atomic
    value: [1, "${eval:'int(2 * (19056 / ${model.initial_hidden_units} - 20) - 1)'}"]
  model.init_random_range_out:
    type: atomic
    value: [20, 20]
  structure_search.enabled: false

  # Best LRs from 02_random_sparse_4task_nonstationary_lr per sparsity.
  optimizer.learning_rate: "${eval:2**${switch:${model.initial_hidden_units}, 48, -8, 96, -7, 192, -7, 384, -6}}"

  seed:
    type: atomic
    value: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130]
