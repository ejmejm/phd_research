experiment: paper-weight-pruning-scaling-best
sweep_name: 02_random_sparse_4task_nonstationary_best_high_freq
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning.py --config-path=../conf/sweeps/weight_pruning_scaling --config-name=base
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]

parameters:
  task.permute_period: 800
  train.eval_freq: 0
  log_individual_seeds: true
  train.log_freq: 100

  model.init_strategy: random_sparse
  # 96 total units (= 24 per task at n=4) was the sparsity-search winner;
  # per-unit budget = 19056/96 = 198.5, avg_in = 178.5, range_in upper = 356.
  model.initial_hidden_units: 96
  model.max_hidden_units: 96
  model.init_random_range_in:
    type: atomic
    value: [1, 356]
  model.init_random_range_out:
    type: atomic
    value: [20, 20]
  structure_search.enabled: false

  optimizer.learning_rate: "${eval:2**-7}"

  seed:
    type: atomic
    value: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130]
