experiment: paper-weight-pruning-scaling-best
sweep_name: 02b_dense_scaling_4task_nonstationary_best
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning.py --config-path=../conf/sweeps/weight_pruning_scaling/02b_nonstationary_scaling --config-name=base_dense_best
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  split_by: [model.initial_hidden_units]

parameters:
  # LR per size is set in base_dense_best.yaml via the switch resolver, using
  # the bests found by 02_dense_scaling_4task_nonstationary_lr (same grid).
  model.initial_hidden_units: [6, 12, 24, 48, 96, 192, 384]

  seed:
    type: atomic
    value: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130]
