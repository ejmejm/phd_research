experiment: paper-weight-pruning-scaling-sweep
sweep_name: 02b_random_sparse_scaling_4task_nonstationary_lr
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning_dynamic.py --config-path=../conf/sweeps/weight_pruning_scaling/02b_nonstationary_scaling --config-name=base_random_sparse
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  split_by: [model.initial_hidden_units]

parameters:
  # Budgets {1x, 2x, ..., 64x} × per-unit cost 49.625 = total weights. Keeping
  # per-unit cost fixed at 03's sparsity_search winner (96 units/task ->
  # avg_in=29.625, range_in=[1,58]) while scaling unit count.
  model.initial_hidden_units: [384, 768, 1536, 3072, 6144, 12288, 24576]

  # Compressed from 02's 5-LR grid based on prior bests (best at 1x was -8..-6).
  # Widened up by two values after the first pass found 2^-6 best at 384 units
  # (upper-edge); -5/-4 covers the possible peak for smaller sparsity-level sizes.
  optimizer.learning_rate:
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"
    - "${eval:2**-6}"
    - "${eval:2**-5}"
    - "${eval:2**-4}"

  seed:
    type: atomic
    value: [0, 1, 2, 3, 4]
