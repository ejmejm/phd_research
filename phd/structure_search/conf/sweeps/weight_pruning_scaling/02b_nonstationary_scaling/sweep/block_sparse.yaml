experiment: paper-weight-pruning-scaling-sweep
sweep_name: 02b_block_sparse_scaling_4task_nonstationary_lr
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning.py --config-path=../conf/sweeps/weight_pruning_scaling/02b_nonstationary_scaling --config-name=base_block_sparse
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  split_by: [model.initial_hidden_units]

parameters:
  # Budgets {1x, 2x, ..., 64x} × per-unit cost 794 = total weights.
  model.initial_hidden_units: [24, 48, 96, 192, 384, 768, 1536]

  # Range mirrors 02_block_sparse_4task_nonstationary_lr.
  optimizer.learning_rate:
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"
    - "${eval:2**-6}"

  seed:
    type: atomic
    value: [0, 1, 2, 3, 4]
