project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

mlflow: true
wandb: false
comet_ml: false

task:
  n_tasks: 4
  permute_period: 800
  standardize: true

model:
  initial_hidden_units: 384         # overridden by sweep
  max_hidden_units: ${model.initial_hidden_units}
  activation: leaky_relu

  init_strategy: random_sparse
  init_random_range_in: [1, 58]
  init_random_range_out: [20, 20]

  max_connections_per_unit: 58
  max_fan_out: 20

# TODO: fill in the best LRs found by 02b_random_sparse_scaling_4task_nonstationary_lr.
# If LR is the same across all sizes, just set a single value. Otherwise use the
# switch resolver — commas inside the nested ${...} have to live in this base
# file. Example template:
#   learning_rate: "${eval:'2**${switch:${model.initial_hidden_units}, 384, -8, 768, -7, 1536, -7, 3072, -7, 6144, -7, 12288, -7, 24576, -7}'}"
optimizer:
  name: sgd
  learning_rate: ???
  weight_decay: 0

structure_search:
  enabled: false
  prune_frequency: 500
  prune_count: 128
  decay_rate: 0.998
  connection_budget: 15000
  gen_range_in: [128, 128]
  gen_range_out: [20, 20]
  max_units_per_event: 8

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 0

seed: [0, 1, 2, 3, 4]
log_individual_seeds: true
