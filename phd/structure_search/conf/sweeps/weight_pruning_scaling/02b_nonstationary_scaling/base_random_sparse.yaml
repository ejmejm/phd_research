project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

mlflow: true
wandb: false
comet_ml: false

task:
  n_tasks: 4
  permute_period: 800
  standardize: true

# random_sparse: 96 units per task (winner of 03's sparsity_search at n=32).
# Per-unit cost = avg_in + avg_out = 29.625 + 20 = 49.625 weights.
# Keeping per-unit cost fixed, scale total budget by scaling unit count:
# 1x=384 units (=19056 weights), 2x=768, 4x=1536, ..., 64x=24576.
model:
  initial_hidden_units: 384         # overridden by sweep
  max_hidden_units: ${model.initial_hidden_units}
  activation: leaky_relu

  init_strategy: random_sparse
  init_random_range_in: [1, 58]     # 2 * 29.625 - 1
  init_random_range_out: [20, 20]

  # Dynamic-network-only: tightened to the range_in upper so the forward
  # pass doesn't pay for unused slots.
  max_connections_per_unit: 58
  max_fan_out: 20

optimizer:
  name: sgd
  learning_rate: 1e-3
  weight_decay: 0

structure_search:
  enabled: false
  prune_frequency: 500
  prune_count: 128
  decay_rate: 0.998
  connection_budget: 15000
  gen_range_in: [128, 128]
  gen_range_out: [20, 20]
  max_units_per_event: 8

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 0

seed: [0, 1, 2, 3, 4]
log_individual_seeds: false
