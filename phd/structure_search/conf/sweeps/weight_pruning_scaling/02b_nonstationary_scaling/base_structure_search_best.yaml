project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

mlflow: true
wandb: false
comet_ml: false

task:
  n_tasks: 4
  permute_period: 800
  standardize: true

model:
  initial_hidden_units: 0
  max_hidden_units: ${eval:800*${structure_search.connection_budget}//19056}
  activation: leaky_relu

  init_strategy: random_sparse      # irrelevant when initial_hidden_units = 0
  init_random_range_in: [1, 256]
  init_random_range_out: [1, 20]

  max_connections_per_unit: 128
  max_fan_out: 20

# TODO: fill in the best LRs found by 02b_structure_search_scaling_4task_nonstationary_lr.
# If LR is the same across all budgets, just set a single value. Otherwise use the
# switch resolver keyed on structure_search.connection_budget — commas inside
# the nested ${...} have to live in this base file. Example template:
#   learning_rate: "${eval:'2**${switch:${structure_search.connection_budget}, 19056, -6, 38112, -6, 76224, -6, 152448, -7, 304896, -7, 609792, -7, 1219584, -7}'}"
optimizer:
  name: sgd
  learning_rate: ???
  weight_decay: 0

structure_search:
  enabled: true
  prune_frequency: 500
  prune_count: ${eval:256*${structure_search.connection_budget}//19056}
  decay_rate: 0.998
  connection_budget: 19056          # overridden by sweep
  gen_range_in: [128, 128]
  gen_range_out: [20, 20]
  max_units_per_event: ${eval:8*${structure_search.connection_budget}//19056}

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 0

seed: [0, 1, 2, 3, 4]
log_individual_seeds: true
