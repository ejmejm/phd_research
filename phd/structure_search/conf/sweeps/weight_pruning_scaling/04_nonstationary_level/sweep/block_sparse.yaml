experiment: paper-weight-pruning-scaling-sweep
sweep_name: 04_block_sparse_permute_period_lr
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning.py --config-path=../conf/sweeps/weight_pruning_scaling/04_nonstationary_level --config-name=base_block_sparse
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  sensitivity:
    params: [task.permute_period]
    hue: [optimizer.learning_rate]

parameters:
  task.permute_period: [200, 400, 800, 1600, 3200, 6400]

  # Range matches 03_block_sparse_n_tasks_lr.
  optimizer.learning_rate:
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"
    - "${eval:2**-6}"

  seed:
    type: atomic
    value: [0, 1, 2, 3, 4]
