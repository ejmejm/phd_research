project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

mlflow: true
wandb: false
comet_ml: false

task:
  n_tasks: 4
  permute_period: 800
  standardize: true

# structure_search: starts at 0 units; max_hidden, connection_budget,
# prune_count, and max_units_per_event are sized to match the n_tasks=4
# resolution of 03's formulas (n=4: max=800, budget=19000, prune=256,
# units_per_event=8).
model:
  initial_hidden_units: 0
  max_hidden_units: 800
  activation: leaky_relu

  init_strategy: random_sparse        # irrelevant when initial_hidden_units = 0
  init_random_range_in: [1, 256]
  init_random_range_out: [1, 20]

  max_connections_per_unit: 128
  max_fan_out: 20

optimizer:
  name: sgd
  learning_rate: 1e-3
  weight_decay: 0

structure_search:
  enabled: true
  prune_frequency: 500
  prune_count: 256
  decay_rate: 0.998
  connection_budget: 19000
  gen_range_in: [128, 128]
  gen_range_out: [20, 20]
  max_units_per_event: 8

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 0

seed: [0, 1, 2, 3, 4]
log_individual_seeds: false
