project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

mlflow: true
wandb: false
comet_ml: false

task:
  n_tasks: 4
  permute_period: 800
  standardize: true

# random_sparse: 96 total units (= 24 per task at n=4) was the winner of
# 02_nonstationary/sweep/random_sparse.yaml. Per-unit weights: avg_in + 20
# = 19056/96 = 198.5, so avg_in = 178.5 and init_random_range_in upper =
# 2 * 178.5 - 1 = 356.
model:
  initial_hidden_units: 96
  max_hidden_units: 96
  activation: leaky_relu

  init_strategy: random_sparse
  init_random_range_in: [1, 356]
  init_random_range_out: [20, 20]

  # Tightened to range_in upper so the dynamic-network forward pass doesn't
  # pay for unused slots.
  max_connections_per_unit: 356
  max_fan_out: 20

optimizer:
  name: sgd
  learning_rate: 1e-3
  weight_decay: 0

structure_search:
  enabled: false
  prune_frequency: 500
  prune_count: 128
  decay_rate: 0.998
  connection_budget: 15000
  gen_range_in: [128, 128]
  gen_range_out: [20, 20]
  max_units_per_event: 8

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 0

seed: [0, 1, 2, 3, 4]
log_individual_seeds: false
