experiment: paper-weight-pruning-scaling-sweep
sweep_name: 02_set_utility_4task_nonstationary_lr
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_set.py --config-path=../conf/sweeps/weight_pruning_scaling/00_experimental/set --config-name=02_base_set
algorithm: grid

spec:
  metric: asymptotic_loss
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  split_by: [set.init_mode]
  sensitivity:
    hue: [optimizer.learning_rate]

parameters:
  # Single hidden width (1x base = 192 units, ε≈5.35), sweep LR only --
  # mirrors 02_nonstationary/block_sparse.yaml's single-size + LR structure.
  target_hidden_units: 192

  # Compare both init formulations on the same H × LR × n_tasks grid.
  set.init_mode: [epsilon, uniform_p]

  # Wide LR range; expect best around 2^-9..2^-10 based on the 01 magnitude
  # sweep result. Spread one step wider on each side because nonstationary
  # tasks typically tolerate a slightly different LR than stationary.
  optimizer.learning_rate:
    - "${eval:2**-11}"
    - "${eval:2**-10}"
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"

  seed:
    type: atomic
    value: [0, 1, 2, 3, 4]
