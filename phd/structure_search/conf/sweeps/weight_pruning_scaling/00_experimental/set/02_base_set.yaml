project: paper-weight-pruning
device: cuda
jax_jit_cache_dir: /tmp/jax_cache

mlflow: true
wandb: false
comet_ml: false

# Stage 02: nonstationary version of the 01 SET sweep. permute_period=800,
# no test eval (matches 02_nonstationary convention).
task:
  n_tasks: 4
  permute_period: 800
  standardize: true

target_hidden_units: 192   # overridden by sweep

model:
  activation: leaky_relu
  fan_in_safety_factor: 2.0

optimizer:
  name: sgd
  learning_rate: 1e-3      # overridden by sweep
  weight_decay: 0

set:
  enabled: true
  evolve_frequency: 500
  zeta: 0.3
  connection_budget: 19056
  # init_mode 'epsilon' (default) uses Erdős-Rényi p = ε(n+m)/(n·m) per layer;
  # 'uniform_p' uses a single p = budget / ((I+O)·H) shared by both layers.
  # See train_set.py:_derive_sizes for full discussion.
  init_mode: epsilon
  epsilon: "${eval:'${set.connection_budget} / (2*${target_hidden_units} + 0.5 + ${task.n_tasks}*794)'}"

  prune_metric: utility    # contribution utility (EMA of |source_act|*|w|)
  utility_decay: 0.999

train:
  batch_size: 1
  total_steps: 500_000
  log_freq: 1000
  eval_freq: 0

seed: [0, 1, 2, 3, 4]
log_individual_seeds: false
