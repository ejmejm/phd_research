experiment: set-analysis-sweep-v2
sweep_name: stationary_random_sparse
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning.py --config-path=../conf/sweeps/weight_pruning_scaling --config-name=base
algorithm: grid

spec:
  metric: asymptotic_test_loss
  direction: minimize

plot_params:
  metrics: [asymptotic_test_loss, asymptotic_test_accuracy]
  sensitivity:
    params: [optimizer.learning_rate]

parameters:
  # Stationary, 8 tasks (the 32-hidden block-sparse frame). With per-task
  # heads, I + O = 8 * 794 = 6352. Test-set eval every 10k steps comes from
  # base.yaml (eval_freq: 10_000), matching the 01_stationary sweeps.
  task.n_tasks: 8
  task.permute_period: 0
  train.eval_freq: 25_000
  log_individual_seeds: false

  model.init_strategy: random_sparse
  # Sparsity held at the 2-task stationary winner: range_in=[1,256] (avg
  # fan-in 128.5), range_out=[1,20] (avg fan-out 10.5) -> ~139 weights/unit.
  # 183 * (128.5 + 10.5) = 25,437 ~= 25,408 (block-sparse 32-unit budget),
  # so this matches the block-sparse results at equal total connection count.
  model.initial_hidden_units: 183
  model.max_hidden_units: 183
  model.init_random_range_in:
    type: atomic
    value: [1, 256]
  model.init_random_range_out:
    type: atomic
    value: [1, 20]
  structure_search.enabled: false

  # Wide range -- random_sparse units have low fan-in and tend to favor larger
  # LRs; mirrors the lr_sweep random_sparse exploration grid.
  optimizer.learning_rate:
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"
    - "${eval:2**-6}"
    - "${eval:2**-5}"

  seed:
    type: atomic
    value: [0, 1, 2]
