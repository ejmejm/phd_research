name: 00_block_sparse_dense_fill_main_n16_h256
project: paper-weight-pruning-scaling-sweep
command: python experiments/train_weight_pruning_dense_fill.py --config-path=../conf/sweeps/weight_pruning_scaling/00_experimental/block_sparse_dense_fill --config-name=base_block_sparse_dense_fill_main
algorithm: grid

spec:
  metric: asymptotic_accuracy
  objective: maximize
  retryAssignLimit: 4

parameters:
  comet_ml: true
  mlflow: false
  # Upload full (n_log_periods, n_seeds) per-seed curve arrays as a single
  # comet asset per trial for true bootstrap-CI plotting in the analysis
  # notebook. Live metric stream still shows the across-seed mean+std.
  log_individual_seeds: true

  # Step at which block_sparse masks flip to all-ones (cross-task weights
  # become trainable, starting at exactly 0). `null` = never fill (block_sparse
  # baseline). `0` = dense from start with cross-task weights starting at 0.
  model.dense_fill_step: [0, 250_000, null]

  # Same 5-LR grid (block_sparse v2 + 2^-11 added).
  optimizer.learning_rate:
    - "${eval:2**-11}"
    - "${eval:2**-10}"
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"

  # Split the 30-seed pool into two halves so each trial only vmaps 15
  # seeds — peak memory then fits comfortably in a 10 GB MIG slice on
  # Nibi. seed_offset is the sweep axis; the actual atomic seed list is
  # built from it via the eval resolver. 3 × 5 × 2 = 30 trials.
  seed_offset: [0, 15]
  seed:
    value:
      - "${eval:${seed_offset} + 0}"
      - "${eval:${seed_offset} + 1}"
      - "${eval:${seed_offset} + 2}"
      - "${eval:${seed_offset} + 3}"
      - "${eval:${seed_offset} + 4}"
      - "${eval:${seed_offset} + 5}"
      - "${eval:${seed_offset} + 6}"
      - "${eval:${seed_offset} + 7}"
      - "${eval:${seed_offset} + 8}"
      - "${eval:${seed_offset} + 9}"
      - "${eval:${seed_offset} + 10}"
      - "${eval:${seed_offset} + 11}"
      - "${eval:${seed_offset} + 12}"
      - "${eval:${seed_offset} + 13}"
      - "${eval:${seed_offset} + 14}"
