experiment: structure-search
sweep_name: adam_lr_sweep
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python train.py
algorithm: grid

spec:
  metric: asymptotic_loss
  direction: minimize

plot_params:
  split_by: model.hidden_dim
  metrics: [asymptotic_loss, asymptotic_accuracy]

parameters:
  mlflow: true

  model.n_layers: 3
  model.hidden_dim: [64, 256]

  optimizer.name: adam

  optimizer.learning_rate:
    - "${eval:2**-19}"
    - "${eval:2**-17}"
    - "${eval:2**-15}"
    - "${eval:2**-13}"
    - "${eval:2**-11}"
    - "${eval:2**-9}"
    - "${eval:2**-7}"
    - "${eval:2**-5}"

  seed:
    type: atomic
    value: [1, 2, 3]
