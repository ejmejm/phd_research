name: set32_batch_v2_set
project: set-32task-sweep
command: python experiments/train_set.py --config-path=../conf/sweeps/set_32task --config-name=base_set
algorithm: grid

spec:
  metric: asymptotic_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  # Comet logging backend (base_set.yaml defaults to mlflow).
  comet_ml: true
  mlflow: false
  log_individual_seeds: false

  # Batch size at a FIXED SAMPLE BUDGET. base_set.yaml derives total_steps,
  # log_freq, evolve_frequency, permute_period and utility_decay from
  # batch_size, so all four cells below see the same 512,000-sample stream with
  # the same drift and evolve schedule -- only the number of optimizer updates
  # changes (512k / 128k / 32k / 8k). Plot against SAMPLES, not steps.
  #
  #   B   steps  log_freq  evolve_freq  permute_period  utility_decay
  #   1  512000      1024          512              64        0.99800
  #   4  128000       256          128              16        0.99202
  #  16   32000        64           32               4        0.96848
  #  64    8000        16            8               1        0.87974
  #
  # Powers of two only: log_freq must stay divisible by evolve_frequency (see
  # the assert in train_set.py:run_experiment). 64 is the ceiling -- at B=128
  # permute_period would round to 0 and the drift would switch off.
  train.batch_size: [1, 4, 16, 64]

  # LR is swept at every batch size rather than reusing the B=1 winner -- whether
  # the best step size moves with the batch is half the question. The grid is
  # anchored at 01_main's winner (2^-6, for both arms) and runs two octaves up.
  # Larger batches give a lower-variance gradient, so they tolerate a larger
  # step; and with 1/B as many updates to track the same drift, they need one.
  # Both effects push the optimum up, never down, so 2^-6 is the floor.
  #
  # NOTE: sqrt-scaling predicts B=64's optimum at 8x the B=1 step, i.e. 2^-3,
  # one octave above this ceiling. If B=64 (or B=16) bottoms out at 2^-4, its
  # optimum is outside the grid and that cell's result is a lower bound on how
  # well the batch can do -- extend before concluding that large batches hurt.
  # This is the full grid as analysed. It was NOT created in one shot: 2^-6..2^-4
  # ran first (sweep 054effb1...), then 2^-3 was added as an extension-only sweep
  # (4f6f6bb5..., this file temporarily reduced to that single value) once the
  # large batches turned out to want a bigger step than the original ceiling.
  # Both sweeps carry the same `name`, so the analysis sees one 16-cell grid.
  # Recreating this file as-is would re-run all 16 cells.
  optimizer.learning_rate:
    - "${eval:2**-6}"
    - "${eval:2**-5}"
    - "${eval:2**-4}"
    - "${eval:2**-3}"

  # 5 seeds atomic: one trial vmaps all 5 seeds.
  # 4 batch_size x 4 LR = 16 trials (12 + 4 extension).
  seed:
    value: [0, 1, 2, 3, 4]
