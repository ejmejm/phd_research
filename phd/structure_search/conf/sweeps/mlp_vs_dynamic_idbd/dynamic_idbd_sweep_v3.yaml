experiment: structure-search
sweep_name: dynamic_idbd_sweep_v3
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python train.py
algorithm: grid

# Match active connections to MLP (hidden_dim=64, n_layers=3): ~201K conns

spec:
  metric: asymptotic_loss
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  sensitivity:
    hue: optimizer.meta_learning_rate

parameters:
  mlflow: true

  model.type: dynamic
  model.n_layers: 3
  model.hidden_dim: 1598
  model.max_connections_per_unit: 32
  model.connect_all_to_output: true
  model.max_fan_out: 64

  optimizer.name: idbd
  optimizer.autostep: true

  optimizer.learning_rate:
    - "${eval:2**-2}"
    - "${eval:2**-1}"
    - "${eval:2**0}"
    - "${eval:2**1}"
    - "${eval:2**2}"
    - "${eval:2**3}"

  optimizer.meta_learning_rate:
    - "${eval:2**-4}"
    - "${eval:2**-3}"
    - "${eval:2**-2}"

  seed:
    type: atomic
    value: [1, 2, 3]
