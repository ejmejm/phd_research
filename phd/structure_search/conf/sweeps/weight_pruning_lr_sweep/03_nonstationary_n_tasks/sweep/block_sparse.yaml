experiment: paper-weight-pruning-sweep
sweep_name: 03_block_sparse_n_tasks
output_dir: outputs
optuna_storage: ${oc.env:OPTUNA_TRACKING_URI}
mlflow_storage: ${oc.env:MLFLOW_TRACKING_URI}
command: python experiments/train_weight_pruning.py --config-path=../conf/sweeps/weight_pruning_lr_sweep/03_nonstationary_n_tasks --config-name=base_block_sparse
algorithm: grid

spec:
  metric: asymptotic_accuracy
  direction: minimize

plot_params:
  metrics: [asymptotic_loss, asymptotic_accuracy]
  sensitivity:
    params: [task.n_tasks]
    hue: [optimizer.learning_rate]

parameters:
  task.n_tasks: [2, 4, 8, 16, 32]

  # 02_block_sparse_lr best LR was 2**-7.
  optimizer.learning_rate:
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"

  seed:
    type: atomic
    value: [0, 1, 2, 3, 4]
