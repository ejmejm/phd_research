name: stationary_set_static
project: set-analysis-sweep-v2
command: python experiments/train_set.py --config-path=../conf/sweeps/weight_pruning_scaling/00_experimental/set --config-name=base_set
algorithm: grid

spec:
  metric: asymptotic_test_loss
  objective: minimize
  retryAssignLimit: 4

parameters:
  # Comet logging backend (base_set.yaml defaults to mlflow).
  comet_ml: true
  mlflow: false
  log_individual_seeds: false

  # Identical to stationary_set EXCEPT zeta=0: the SET evolve step prunes and
  # regrows zero connections, so the network is frozen at its initial sparse
  # topology (no structural change). This is the "static SET-init" baseline --
  # like random_sparse, but the sparsity pattern is generated by SET's ER init
  # (init_mode) rather than the random_sparse fan-in/out ranges.
  #
  # prune_metric is a no-op at zeta=0 (it only selects WHICH weights to prune,
  # and none are pruned), so it is fixed rather than swept to avoid running
  # every cell twice identically. utility_decay is likewise irrelevant here.
  task.n_tasks: 8
  task.permute_period: 0
  train.eval_freq: 25_000
  set.connection_budget: 25408
  set.zeta: 0
  set.prune_metric: magnitude

  # Same size / init / LR axes as stationary_set.
  target_hidden_units: [96, 192, 384]
  set.init_mode: [epsilon, uniform_p]
  optimizer.learning_rate:
    - "${eval:2**-10}"
    - "${eval:2**-9}"
    - "${eval:2**-8}"
    - "${eval:2**-7}"
    - "${eval:2**-6}"

  # 5 seeds atomic: one trial vmaps all 5 seeds.
  # 2 init_mode x 3 target_hidden_units x 5 LR = 30 trials.
  seed:
    value: [0, 1, 2, 3, 4]
